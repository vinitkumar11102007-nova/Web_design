<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cart</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body onload="renderCart()">
  <div class="right-frame">
    <h2>Your Shopping Cart</h2>
    <table class="cart">
      <thead>
        <tr>
          <th>Book Name</th>
          <th>Price</th>
          <th>Quantity</th>
          <th>Amount</th>
        </tr>
      </thead>
      <tbody id="cartBody">
        <!-- rows are injected by js/cart.js -->
      </tbody>
      <tfoot>
        <tr class="total-row">
          <td colspan="3">Total Amount</td>
          <td id="cartTotal">$0.00</td>
        </tr>
      </tfoot>
    </table>
  </div>
  <script src="js/cart.js"></script>
</body>
</html>
